name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend syntax
        run: for f in public/js/*.js scripts/*.mjs; do node --check "$f"; done

      # Uses fake PayPal and fake Gemini; no secrets needed. The live Gemini test skips itself.
      - name: Run tests
        run: npm test
        env:
          MOCK_AI: 'true'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
