# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repository. Fill in the secret values when prompted.
services:
  - type: web
    name: ask-and-buy
    runtime: node
    # Free plan: no persistent disk, so the SQLite database (orders, carts, chats) is reset
    # on every deploy or restart, and the service sleeps after 15 minutes without traffic.
    # To keep data: set `plan: starter` and add
    #   disk: { name: data, mountPath: /var/data, sizeGB: 1 }
    # plus the env var DATABASE_PATH=/var/data/ai-checkout.db
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      # Render runs behind one proxy hop: needed for per-IP rate limits and HTTPS detection
      - key: TRUST_PROXY
        value: 1
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: MOCK_AI
        value: 'false'
      # Secrets: entered in the Render dashboard, never committed
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
