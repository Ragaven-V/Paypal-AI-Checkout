<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Ask & Buy Admin Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #001c64;
      --primary: #0070e0;
      --primary-hover: #005ea6;
      --primary-light: #e6f0fc;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-alt: #f7f9fc;
      --surface-border: #e3e7ee;
      --text-main: #001435;
      --text-muted: #545d68;
      --green: #018a4b;
      --amber: #b35c00;
      --red: #d20000;
      --pill: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--navy);
      color: #fff;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    header h1 { font-size: 1.15rem; font-weight: 800; }
    header a { color: rgba(255,255,255,0.8); font-size: 0.85rem; text-decoration: none; }
    header a:hover { color: #fff; }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(0, 20, 53, 0.06);
    }

    /* Login */
    .login {
      max-width: 380px;
      margin: 3rem auto;
      padding: 1.75rem;
    }

    .login h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 0.35rem; }
    .login p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.1rem; line-height: 1.5; }

    input[type="password"], select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #c5ccd6;
      border-radius: var(--pill);
      font: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      background: var(--surface);
      outline: none;
    }

    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 112, 224, 0.25); }

    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.75rem 1.4rem;
      border-radius: var(--pill);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { background: #b9c3cf; cursor: not-allowed; }
    .btn-outline { background: var(--surface); color: var(--primary); border: 1.5px solid var(--primary); }
    .btn-outline:hover { background: var(--primary-light); }

    .login .btn { width: 100%; margin-top: 0.75rem; }

    .error { color: var(--red); font-size: 0.82rem; margin-top: 0.75rem; min-height: 1.2em; }

    /* Dashboard */
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .tile { padding: 1rem 1.1rem; }
    .tile-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .tile-value { font-size: 1.5rem; font-weight: 800; margin-top: 0.2rem; font-variant-numeric: tabular-nums; }
    .tile-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.1rem; font-variant-numeric: tabular-nums; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--surface-border);
    }

    .toolbar h2 { font-size: 1rem; font-weight: 800; }
    .toolbar-controls { display: flex; gap: 0.5rem; align-items: center; }
    .toolbar select { width: auto; padding: 0.5rem 0.9rem; font-size: 0.82rem; }
    .toolbar .btn { padding: 0.5rem 1rem; font-size: 0.82rem; }

    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    th, td { padding: 0.7rem 1.1rem; text-align: left; border-bottom: 1px solid var(--surface-border); vertical-align: top; }
    th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); background: var(--surface-alt); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: none; }

    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem; word-break: break-all; }
    .muted { color: var(--text-muted); font-size: 0.76rem; }
    .lines { list-style: none; }

    .pill {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: var(--pill);
      background: var(--surface-alt);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .pill.paid { background: #e3f6ec; color: var(--green); }
    .pill.pending { background: #fff4e0; color: var(--amber); }
    .pill.bad { background: #fdecec; color: var(--red); }

    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.1rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      gap: 0.75rem;
    }
    .pager .btn { padding: 0.45rem 0.9rem; font-size: 0.8rem; }

    .empty { padding: 2.5rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.9rem; }

    [hidden] { display: none !important; }

    @media (max-width: 640px) {
      header { padding: 0.75rem 1rem; }
      th, td { padding: 0.6rem 0.75rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Ask & Buy · Orders admin</h1>
    <a href="/">← Back to store</a>
  </header>

  <main>
    <!-- Login -->
    <section class="card login" id="login-view">
      <h2>Admin sign-in</h2>
      <p>Enter the admin password set as <code>ADMIN_TOKEN</code> in the server's <code>.env</code> file.</p>
      <form id="login-form">
        <input type="password" id="token-input" placeholder="Admin password" autocomplete="current-password" required>
        <button type="submit" class="btn">Show orders</button>
        <div class="error" id="login-error" role="alert"></div>
      </form>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-view" hidden>
      <div class="tiles" id="tiles"></div>

      <div class="card">
        <div class="toolbar">
          <h2>All orders</h2>
          <div class="toolbar-controls">
            <select id="status-filter" aria-label="Filter by status">
              <option value="">All statuses</option>
              <option value="COMPLETED">Paid</option>
              <option value="PENDING">Pending</option>
              <option value="APPROVED">Approved</option>
              <option value="CREATED">Not paid</option>
              <option value="REFUNDED">Refunded</option>
              <option value="REVERSED">Reversed</option>
              <option value="DENIED">Denied</option>
            </select>
            <button type="button" class="btn btn-outline" id="btn-refresh">Refresh</button>
            <button type="button" class="btn btn-outline" id="btn-signout">Sign out</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Order</th>
                <th>Items</th>
                <th>Status</th>
                <th class="num">Total</th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
        <div class="empty" id="orders-empty" hidden>No orders match this filter.</div>
        <div class="pager">
          <span id="pager-info"></span>
          <span>
            <button type="button" class="btn btn-outline" id="btn-prev">Previous</button>
            <button type="button" class="btn btn-outline" id="btn-next">Next</button>
          </span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const PAGE_SIZE = 25;
    let token = '';
    let offset = 0;
    let total = 0;

    try { token = sessionStorage.getItem('ai_checkout_admin') || ''; } catch (e) { /* storage blocked */ }

    const $ = (id) => document.getElementById(id);
    const dateFmt = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });

    function statusClass(status) {
      if (status === 'COMPLETED') return 'paid';
      if (status === 'PENDING' || status === 'APPROVED') return 'pending';
      if (status === 'DENIED' || status === 'REFUNDED' || status === 'REVERSED') return 'bad';
      return '';
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function showLogin(message = '') {
      $('dashboard-view').hidden = true;
      $('login-view').hidden = false;
      $('login-error').textContent = message;
      $('token-input').focus();
    }

    function renderTiles(summary) {
      const byStatus = Object.fromEntries(summary.map(s => [s.status, s]));
      const totalOrders = summary.reduce((n, s) => n + s.count, 0);
      const tiles = [
        ['Paid orders', byStatus.COMPLETED?.count ?? 0, `${byStatus.COMPLETED?.total ?? '$0.00'} revenue`],
        ['Pending', (byStatus.PENDING?.count ?? 0) + (byStatus.APPROVED?.count ?? 0), 'awaiting PayPal'],
        ['Unfinished checkouts', byStatus.CREATED?.count ?? 0, 'PayPal opened, not paid'],
        ['Refunded / reversed', (byStatus.REFUNDED?.count ?? 0) + (byStatus.REVERSED?.count ?? 0), `${totalOrders} orders in total`]
      ];
      $('tiles').replaceChildren(...tiles.map(([label, value, sub]) => {
        const tile = el('div', 'card tile');
        tile.append(el('div', 'tile-label', label), el('div', 'tile-value', String(value)), el('div', 'tile-sub', sub));
        return tile;
      }));
    }

    function renderOrders(orders) {
      $('orders-empty').hidden = orders.length > 0;
      $('orders-body').replaceChildren(...orders.map(order => {
        const tr = document.createElement('tr');

        const dateTd = el('td');
        dateTd.append(el('div', '', dateFmt.format(new Date(order.createdAt))));

        const orderTd = el('td');
        orderTd.append(el('div', 'mono', order.orderID));
        if (order.captureId) orderTd.append(el('div', 'muted', `Capture ${order.captureId}`));
        orderTd.append(el('div', 'muted', order.webhookConfirmed ? 'Confirmed by webhook' : 'No webhook yet'));

        const itemsTd = el('td');
        const list = el('ul', 'lines');
        order.lines.forEach(l => list.append(el('li', '', `${l.quantity} × ${l.name}`)));
        itemsTd.append(list);

        const statusTd = el('td');
        statusTd.append(el('span', `pill ${statusClass(order.status)}`, order.statusLabel));

        tr.append(dateTd, orderTd, itemsTd, statusTd, el('td', 'num', order.amount));
        return tr;
      }));

      const from = total === 0 ? 0 : offset + 1;
      const to = Math.min(offset + PAGE_SIZE, total);
      $('pager-info').textContent = `${from}–${to} of ${total}`;
      $('btn-prev').disabled = offset === 0;
      $('btn-next').disabled = offset + PAGE_SIZE >= total;
    }

    async function load() {
      if (!token) return showLogin();
      const params = new URLSearchParams({ limit: PAGE_SIZE, offset });
      const status = $('status-filter').value;
      if (status) params.set('status', status);

      try {
        const res = await fetch(`/api/admin/orders?${params}`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          token = '';
          try { sessionStorage.removeItem('ai_checkout_admin'); } catch (e) { /* ignore */ }
          return showLogin('Wrong password. Please try again.');
        }
        if (!res.ok) return showLogin(data.error || `Could not load orders (HTTP ${res.status}).`);

        total = data.total;
        $('login-view').hidden = true;
        $('dashboard-view').hidden = false;
        renderTiles(data.summary);
        renderOrders(data.orders);
      } catch (err) {
        showLogin('Could not reach the server.');
      }
    }

    $('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      token = $('token-input').value;
      $('token-input').value = '';
      try { sessionStorage.setItem('ai_checkout_admin', token); } catch (e) { /* keep in memory */ }
      offset = 0;
      load();
    });

    $('status-filter').addEventListener('change', () => { offset = 0; load(); });
    $('btn-refresh').addEventListener('click', load);
    $('btn-prev').addEventListener('click', () => { offset = Math.max(0, offset - PAGE_SIZE); load(); });
    $('btn-next').addEventListener('click', () => { offset += PAGE_SIZE; load(); });
    $('btn-signout').addEventListener('click', () => {
      token = '';
      try { sessionStorage.removeItem('ai_checkout_admin'); } catch (e) { /* ignore */ }
      showLogin();
    });

    load();
  </script>
</body>
</html>
