<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Ask & Buy Admin Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header>
    <h1>Ask & Buy · Orders admin</h1>
    <a href="/">← Back to store</a>
  </header>

  <main>
    <!-- Login -->
    <section class="card login" id="login-view">
      <h2>Admin sign-in</h2>
      <p>Enter the admin password set as <code>ADMIN_TOKEN</code> in the server's <code>.env</code> file.</p>
      <form id="login-form">
        <input type="password" id="token-input" placeholder="Admin password" autocomplete="current-password" required>
        <button type="submit" class="btn">Show orders</button>
        <div class="error" id="login-error" role="alert"></div>
      </form>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-view" hidden>
      <div class="tiles" id="tiles"></div>

      <div class="card">
        <div class="toolbar">
          <h2>All orders</h2>
          <div class="toolbar-controls">
            <select id="status-filter" aria-label="Filter by status">
              <option value="">All statuses</option>
              <option value="COMPLETED">Paid</option>
              <option value="PENDING">Pending</option>
              <option value="APPROVED">Approved</option>
              <option value="CREATED">Not paid</option>
              <option value="REFUNDED">Refunded</option>
              <option value="REVERSED">Reversed</option>
              <option value="DENIED">Denied</option>
            </select>
            <button type="button" class="btn btn-outline" id="btn-refresh">Refresh</button>
            <button type="button" class="btn btn-outline" id="btn-signout">Sign out</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Order</th>
                <th>Items</th>
                <th>Status</th>
                <th class="num">Total</th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
        <div class="empty" id="orders-empty" hidden>No orders match this filter.</div>
        <div class="pager">
          <span id="pager-info"></span>
          <span>
            <button type="button" class="btn btn-outline" id="btn-prev">Previous</button>
            <button type="button" class="btn btn-outline" id="btn-next">Next</button>
          </span>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/admin.js" defer></script>
</body>
</html>
